name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a push mid-run queues rather than cancelling, so
# main always ends up published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check out DISCO-EB beside this repository
        # `[tool.uv.sources]` installs discoeb from ../DISCO-EB. The branch is
        # the repository variable DISCOEB_REF, `v2` without it.
        run: >
          git clone --depth 1 --branch "${{ vars.DISCOEB_REF || 'v2' }}"
          https://github.com/cosmo-sims/DISCO-EB.git ../DISCO-EB
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # Sphinx's newest releases need 3.13.
          python-version: "3.13"
      - name: Install the package and the docs toolchain
        # autodoc imports discocmb, so the project and its dependencies come
        # too; the dev group does not. No GPU is needed to import.
        run: uv sync --frozen --no-default-groups --group docs
      - name: Build the site
        # -W: a warning (a broken reference, a missing include) fails the build.
        run: uv run --no-sync sphinx-build -W --keep-going docs docs/_build/html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
